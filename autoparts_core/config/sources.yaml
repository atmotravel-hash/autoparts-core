  - id: otomoto
    name: Otomoto
    method: Candidate
    graphql: false
    status: blocked_challenge
    countries: [PL]
    notes: Vehicle marketplace; challenge on GraphQL probe

  - id: mobile_de
    name: mobile.de
    method: Candidate
    graphql: false
    status: blocked_challenge
    countries: [DE]
    notes: Cars, not parts-first; GraphQL blocked

  - id: eurocarparts
    name: Euro Car Parts / Omnipart
    method: API Platform / GraphiQL candidate
    graphql: true
    endpoint: https://api.omnipart.eurocarparts.com/graphql
    status: access_denied
    countries: [GB]
    notes: 403 Forbidden without auth

  - id: goodvin
    name: GOODVIN catalog API
    method: Documented REST catalog
    graphql: false
    status: unevaluated_auth
    countries: [UA, MD, EU]
    notes: Docs at goodvin.net/api — requires account/terms review before use

  - id: dekoparts
    name: Dekoparts UA
    method: GraphQL (Vendure) candidate
    graphql: true
    status: unevaluated
    countries: [UA]
    notes: B2B wholesale; GraphQL reported in case study — no public test yet

  - id: motopoland
    name: MotoPoland
    method: Allegro-backed aggregator
    graphql: false
    status: unevaluated
    countries: [UA, PL]
    notes: Aggregates Allegro; prefer Allegro official API

  - id: partsfrog
    name: PartsFrog
    method: Shopify storefront
    graphql: false
    status: not_graphql_catalog
    countries: [US]
    notes: /graphql returned HTML interstitial — out of primary market

# Preferred live search order when DEMO_MODE mixes sources
default_live_source_ids:
  - olx_ua
  - olx_pl
  - olx_ro
  - olx_bg
  - olx_pt
  - nine99_md
