# Catalog of thematic sources for Europe / Moldova / Ukraine.
# operational=true only after a successful test in this environment.

sources:
  - id: fixture
    name: Offline Fixture Source
    method: FIXTURE
    graphql: false
    status: operational
    countries: [DE, PL, LT, UA, MD]
    notes: Demo data only

  - id: manual
    name: Manual URL Import
    method: MANUAL_IMPORT
    graphql: false
    status: operational
    countries: []
    notes: Metadata import with SSRF checks

  - id: nine99_md
    name: 999.md Moldova
    method: GraphQL POST https://999.md/graphql
    graphql: true
    endpoint: https://999.md/graphql
    status: operational
    countries: [MD]
    tested: 2026-10-26
    notes: Public catalog searchAds / advert — verified

  - id: olx_ua
    name: OLX Ukraine
    method: GraphQL POST /apigateway/graphql
    graphql: true
    endpoint: https://www.olx.ua/apigateway/graphql
    status: operational
    countries: [UA]
    tested: 2026-10-26
    notes: ListingSearchQuery — verified

  - id: olx_pl
