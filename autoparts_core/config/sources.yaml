# Active sources only — no credential/CAPTCHA/partner-hassle in the default path.
# Deferred ideas live under deferred_sources (not loaded into search).

sources:
  - id: fixture
    name: Offline Fixture Source
    method: FIXTURE
    status: operational
    countries: [DE, PL, LT, UA, MD]
    notes: Demo data only — labelled is_demo_data

  - id: manual
    name: Manual URL Import
    method: MANUAL_IMPORT
    status: operational
    countries: []
    notes: User URL/CSV metadata — SSRF-safe

  - id: nine99_md
    name: 999.md Moldova
    method: GraphQL POST https://999.md/graphql
    status: operational
    countries: [MD]
    tested: 2026-10-26
    notes: Public catalog — verified

  - id: olx_ua
    name: OLX Ukraine
    method: GraphQL POST /apigateway/graphql
    status: operational
    countries: [UA]
    tested: 2026-10-26

  - id: olx_pl
    name: OLX Poland
    method: GraphQL POST /apigateway/graphql
    status: operational
    countries: [PL]
    tested: 2026-10-26

  - id: olx_ro
    name: OLX Romania
    method: GraphQL POST /apigateway/graphql
    status: operational
    countries: [RO]
    tested: 2026-10-26

  - id: olx_bg
    name: OLX Bulgaria
    method: GraphQL POST /apigateway/graphql
    status: operational
    countries: [BG]
    tested: 2026-10-26

  - id: olx_pt
    name: OLX Portugal
    method: GraphQL POST /apigateway/graphql
