  - id: ebay
    name: eBay
    method: Official Developer API
    graphql: false
    status: credentials_missing
    countries: [DE, PL, FR, IT, ES, GB]
    notes: Requires EBAY_APP_ID — not tested live

  - id: allegro
    name: Allegro
    method: Official REST API
    graphql: false
    status: credentials_missing
    countries: [PL]
    notes: OAuth required — GraphQL HTML blocked by captcha

  - id: brave_search
    name: Brave Search
    method: Search API
    graphql: false
    status: credentials_missing
    countries: []
    notes: Discovery only when API key present

  - id: autodoc
    name: AUTODOC
    method: Candidate catalog / RapidAPI
    graphql: false
    status: blocked_challenge
    countries: [DE, PL, LT, UA, RO]
    notes: Cloudflare challenge on /graphql — NOT bypassed; needs authorized access

  - id: ovoko
    name: Ovoko / RRR
    method: Partner API candidate
    graphql: false
    status: blocked_challenge
    countries: [LT, PL, DE, UA]
    notes: Cloudflare on public GraphQL probe — seller partner API not configured

  - id: intercars
    name: Inter Cars
    method: Candidate
    graphql: false
    status: blocked_challenge
    countries: [PL, LT, LV, EE, RO, HU, SK, CZ]
    notes: Public /graphql not available without challenge

  - id: dok_ua
    name: DOK.ua
    method: Candidate
    graphql: false
