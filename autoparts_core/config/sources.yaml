# Default live search — zero keys required
default_live_source_ids:
  - olx_ua
  - olx_pl
  - olx_ro
  - olx_bg
  - olx_pt
  - nine99_md

# Explicitly deferred (гемор: ключи / OAuth / Cloudflare / партнёрки / лимиты)
